{% load i18n %}<!DOCTYPE html>
<html lang="{{ language|default:"en" }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block subject %}{% endblock %}</title>
<style>
  body { margin: 0; padding: 0; background: #f4f4f5; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; }
  .container { max-width: 600px; margin: 0 auto; padding: 24px; }
  .content { background: #ffffff; border-radius: 8px; padding: 32px; }
  .footer { font-size: 12px; color: #6b7280; padding: 24px 8px 0; line-height: 1.5; }
  .footer a { color: #6b7280; }
  table { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="container">
  <div class="content">
    {% block content %}{% endblock %}
  </div>
  <div class="footer">
    {% include "notifications/_email_footer.html" %}
  </div>
</div>
</body>
</html>
