<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two-factor authentication</title>
</head>
<body>
  <h1>Two-factor authentication</h1>
  <p>Enter the 6-digit code from your authenticator app, or a recovery code.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Verify</button>
  </form>
</body>
</html>
