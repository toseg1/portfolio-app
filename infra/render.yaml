# Render Blueprint (ADR-028 layout; tiers/region from ADR-013).
#
# STILL OPEN, do not guess further here (ADR-028 "Local and production
# isolation" / ADR-011): the real production domain names, SESSION_COOKIE_DOMAIN,
# CSRF_TRUSTED_ORIGINS and the apex/api. subdomain split are not decided
# anywhere yet. Nothing below wires them — settle the domain layout before
# the first deploy, then add those env vars.
#
# Verify against current Render docs before first deploy: the Key Value
# (Redis) resource `type` and the Postgres `plan` slug below may have been
# renamed since this was written.

databases:
  - name: portfolio-postgres
    plan: basic-256mb # ADR-013: PostgreSQL, Basic tier, ~$6/mo
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: redis
    name: portfolio-redis
    plan: starter # ADR-013: Key Value (Redis), Starter tier, $10/mo
    region: frankfurt
    ipAllowList: [] # no public access — only same-project services connect

  - type: web
    name: portfolio-backend
    runtime: docker
    rootDir: backend
    # Relative to rootDir, not the repo root — otherwise Render resolves
    # this as backend/backend/Dockerfile and fails to clone the build context.
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter # ADR-013: Django web service, Starter tier, $7/mo
    region: frankfurt
    # No healthCheckPath: config/urls.py has no endpoints yet by design
    # (roadmap item 1 forbids creating one). Render falls back to a
    # TCP-level check until a real health endpoint exists.
    # Runs after build, before the new release goes live. Without this,
    # django-celery-beat's tables never exist in production and the
    # embedded Beat scheduler crashes silently on every boot.
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false # set to the real api. subdomain once the domain layout is settled
      - key: FRONTEND_URL
        sync: false # set to the real apex domain once the domain layout is settled — required for settings.py to import (HEADLESS_FRONTEND_URLS)
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: portfolio-redis
          type: redis
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          name: portfolio-redis
          type: redis
          property: connectionString
      # Guard 4 (ADR-029) requires these to boot. Not secrets — a sender
      # address is visible in every email's From header — so committed
      # here rather than sync: false, matching .env.example exactly.
      # Update both places together once the real domain is bought.
      - key: EMAIL_DOMAIN
        value: example.invalid
      - key: EMAIL_FROM_SYSTEM
        value: "Portfolio App <hello@example.invalid>"
      - key: EMAIL_FROM_ADVISORY
        value: "Théo Seguin <theo.seguin@example.invalid>"
      - key: EMAIL_REPLY_TO
        value: hello@example.invalid
      - key: EMAIL_OPERATOR_ALERTS
        value: theo.seguin@example.invalid

  - type: worker
    name: portfolio-celery-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: celery -A config worker --beat -l info
    plan: starter # ADR-013: Celery worker, Starter tier, $7/mo
    region: frankfurt
    # No preDeployCommand here on purpose. Django's migrate has no
    # cross-process locking — running it here too, concurrently with
    # portfolio-backend's on the same shared database, caused exactly
    # that: two simultaneous migrate runs both saw an empty migration
    # history and collided creating the same tables. migrate runs on
    # portfolio-backend only; this worker just starts.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false # set to the real apex domain once the domain layout is settled — required for settings.py to import (HEADLESS_FRONTEND_URLS)
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: portfolio-redis
          type: redis
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          name: portfolio-redis
          type: redis
          property: connectionString
      - key: ENABLE_BEAT
        value: "true" # Guard 1 (ADR-028): true only here, nowhere else
      # Guard 4 (ADR-029) requires these to boot — see portfolio-backend.
      - key: EMAIL_DOMAIN
        value: example.invalid
      - key: EMAIL_FROM_SYSTEM
        value: "Portfolio App <hello@example.invalid>"
      - key: EMAIL_FROM_ADVISORY
        value: "Théo Seguin <theo.seguin@example.invalid>"
      - key: EMAIL_REPLY_TO
        value: hello@example.invalid
      - key: EMAIL_OPERATOR_ALERTS
        value: theo.seguin@example.invalid

  - type: web
    name: portfolio-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter # SSR needed for entitlement-gated pages — ADR-013 (amended)
    region: frankfurt
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: portfolio-backend
          type: web
          property: hostport
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: fr-FR
